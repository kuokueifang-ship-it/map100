// app 模組 build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.customernavigator'
    compileSdk 34

    defaultConfig {
        applicationId "com.customernavigator"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 純 WebView 方案，不需要額外依賴
}

